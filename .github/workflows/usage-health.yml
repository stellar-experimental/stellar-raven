name: Usage archive health
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check archive canary and collection gaps
        env:
          USAGE_REPORT_TOKEN: ${{ secrets.USAGE_REPORT_TOKEN }}
        run: node scripts/check-usage-health.mjs
