name: CI

on:
  push:
    branches: [main]
  pull_request:

# Explicit least-privilege token: this workflow only reads the repo. The repo
# default is currently read-only too, but that's a mutable setting — pin it
# here so fork PRs on the public repo can never inherit anything broader.
permissions:
  contents: read

jobs:
  # Server-side backstop for the pre-commit hook (scripts/scan-secrets.mjs).
  # Runs on every push/PR regardless of GitHub plan — unlike GitHub push
  # protection, which needs paid Secret Protection on private repos. Once this
  # repo is public, GitHub's native secret scanning (+ .github/secret_scanning.yml)
  # layers on top of this. Zero-dep: no npm install, full history checkout so it
  # can scan what actually landed.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: scan tracked files for secrets
        run: node scripts/scan-secrets.mjs --tree

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 24: build-catalog.mjs relies on native TS type-stripping, stable
          # since Node 23.6 (see scripts/build-catalog.mjs). Do not drop below 24.
          node-version: 24
          cache: npm
      - run: npm ci
      # wrangler types derives the Env interface from wrangler.jsonc bindings
      # PLUS .dev.vars names; without the stub, Env loses the secret members and
      # tsc fails. Names only — never real values.
      - name: stub .dev.vars for type generation
        run: printf 'LUMENLOOP_API_KEY=x\nALGOLIA_APPLICATION_ID_DOCS=x\nALGOLIA_API_KEY_DOCS=x\nALGOLIA_APPLICATION_ID_SITE=x\nALGOLIA_API_KEY_SITE=x\nWORKOS_CLIENT_ID=x\nWORKOS_API_KEY=x\nMCP_SERVER_SECRET=x\nDEV_ALLOW_UNAUTHENTICATED=x\n' > .dev.vars
      - run: npm run typegen
      - run: npm run typecheck
      # Bundle/deploy path: dry-run the Worker build so a broken bundle, a missing/
      # renamed binding, a bad import, or a size regression fails CI here instead of
      # only surfacing at the manual `npm run deploy`. Offline — `--dry-run` exits
      # before any upload, so no secrets or network are needed.
      - run: npm run build
      # Pin .gitleaks.toml semantics in CI too: without the binary the
      # test/scan-secrets-gitleaks.test.mjs suite self-skips and the config is
      # only exercised on developer machines.
      # Version pinned to the release the suite was written against.
      - name: install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            | grep '  gitleaks_8.30.1_linux_x64.tar.gz$' \
            | sed "s#  gitleaks_8.30.1_linux_x64.tar.gz#  $RUNNER_TEMP/gitleaks/gitleaks.tar.gz#" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      # NETWORK NOTE: since skill bodies stopped being vendored, several lanes
      # fetch the files pinned in ecosystem-skills/MANIFEST.json from
      # raw.githubusercontent.com and verify them against the recorded digests.
      # That is NOT confined to the artifact gate below — on a cold checkout it
      # includes `npm test` (test/skills.test.ts, test/search.test.ts,
      # test/executor-providers.test.ts via test/helpers/skill-source.ts) and the
      # smoke lane's config. The cache below makes it one fetch per MANIFEST
      # revision; the workerd lane itself stays offline behind its outbound wall.
      - name: cache pinned skill bodies
        uses: actions/cache@v4
        with:
          path: ecosystem-skills/.cache
          key: skill-bodies-${{ hashFiles('ecosystem-skills/MANIFEST.json') }}
      - run: npm test
      # workerd smoke lane (test/smoke/): the assembled router
      # + real Dynamic Worker executor boundary via vitest-pool-workers.
      # Offline enforced (miniflare outboundService wall) — auth/keys are
      # test-only fakes from its config, so no repo secrets are needed.
      - run: npm run test:smoke
      # Deterministic eval gates (eval/EVALS.md): the grader's own fixture suite
      # (eval/lib/*.mjs is not covered by vitest) + the routing gate — legacy 338
      # within ±1% of eval/gates.json, skills lane top-1 at/above its floor.
      # Both offline: searchCatalog over the committed manifest, no live services.
      # (`eval:qa:selftest` is deliberately NOT here: the judge self-test spawns
      # the live `claude` CLI to grade fixtures, so it is a run-evals manual gate,
      # not an offline CI step — see .agents/skills/run-evals/SKILL.md.)
      - run: npm run eval:selftest
      - run: npm run eval:qa:lint -- --stale
      - run: npm run eval:qa:register -- --check
      - name: lint frozen canonical live contract
        run: |
          BASE="$(node -e 'const event = process.env.GITHUB_EVENT_PATH ? JSON.parse(require("node:fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")) : {}; process.stdout.write(event.pull_request?.base?.sha ?? event.before ?? "HEAD^")')"
          node eval/qa/lint-corpus.mjs --live-contract eval/qa/corpus/live/live-cases.json --since "$(git merge-base HEAD "$BASE")"
      - run: npm run improvements:lint
      # A skill pin cannot move without a recorded human review of the body diff
      # (skills are prompt input; the text no longer appears in `git diff`).
      - name: skill pin review ledger
        run: |
          BASE="$(node -e 'const e = process.env.GITHUB_EVENT_PATH ? JSON.parse(require("node:fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")) : {}; process.stdout.write(e.pull_request?.base?.sha ?? e.before ?? "HEAD^")')"
          node scripts/check-pin-review.mjs --base "$BASE"
      - run: npm run eval:routing -- --gate
      # Generated artifacts must match their sources exactly (they are rebuilt,
      # never hand-edited). op-classes reads the freshly-rebuilt
      # catalog/manifest.json (so it runs after build-catalog).
      # Deliberately NOT gated here: src/og.ts and src/fonts.ts. Both are
      # committed generated artifacts, but their generators fetch IBM Plex from
      # github.com/google/fonts at unpinned URLs and shell out to ImageMagick,
      # so gating would trade a flaky network dependency for staleness in a
      # social-preview image and a font blob — cosmetic surfaces with no policy,
      # data, or exposure impact. Consequence to accept knowingly: an edit to
      # scripts/lib/dither-globe.mjs regenerates the gated globes while og.ts
      # keeps the old one, so /og.png stops mirroring the playground backdrop
      # its own header claims to match. Rerun `npm run site:og && npm run
      # site:fonts` by hand when touching the globe or FACES list.
      - name: generated artifacts in sync
        run: |
          node scripts/build-catalog.mjs
          npm run micro-map:build
          npm run spec:build
          npm run site:globes
          node scripts/check-mirrors.mjs
          # INDEX.md is generated from MANIFEST.json + groups.json, so it can go
          # stale (or carry a false claim) without any other check noticing —
          # check-mirrors only asserts the file exists.
          node ecosystem-skills/build-index.mjs
          node eval/compile-routing.mjs
          node eval/qa/compile-qa.mjs
          node eval/plan/build-op-classes.mjs
          if ! git diff --exit-code --stat -- catalog specs src/mcp/micro-map.ts src/demo/globe.ts src/consent-globe.ts ecosystem-skills/INDEX.md eval/routing-cases.json eval/qa/cases.json eval/qa/sample.json eval/plan/op-classes.json; then
            echo "::error::generated artifacts out of sync — run the build scripts locally and commit the result"
            exit 1
          fi
