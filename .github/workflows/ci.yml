name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pin read-only permissions so fork PRs cannot inherit broader repo defaults.
permissions:
  contents: read

jobs:
  # Defense-in-depth over GitHub secret scanning; runs without npm ci.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: scan tracked files for secrets
        run: node scripts/scan-secrets.mjs --tree

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          # Node 24 required for native TS type-stripping (scripts/build-catalog.mjs).
          node-version: 24
          cache: npm
      - run: npm ci
      # wrangler types derives Env from wrangler.jsonc plus .dev.vars names (placeholders only).
      - name: stub .dev.vars for type generation
        run: printf 'LUMENLOOP_API_KEY=x\nMINTLIFY_ASSISTANT_API_KEY=x\nWORKOS_CLIENT_ID=x\nWORKOS_API_KEY=x\nMCP_SERVER_SECRET=x\nDEV_ALLOW_UNAUTHENTICATED=x\n' > .dev.vars
      - run: npm run typegen
      - run: npm run typecheck
      # Dry-run Worker bundle offline to catch bundle, binding, or import regressions before deploy.
      - run: npm run build
      - run: npm run build:usage
      - run: npm run test:usage-report
      - run: npm run build:usage-report
      # Install pinned gitleaks so test/scan-secrets-gitleaks.test.mjs runs instead of self-skipping.
      - name: install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL -o "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt \
            | grep '  gitleaks_8.30.1_linux_x64.tar.gz$' \
            | sed "s#  gitleaks_8.30.1_linux_x64.tar.gz#  $RUNNER_TEMP/gitleaks/gitleaks.tar.gz#" \
            | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
      # Cache upstream pinned skill bodies fetched by npm test, smoke, and builders (verified against MANIFEST.json digests).
      - name: cache pinned skill bodies
        uses: actions/cache@v4
        with:
          path: ecosystem-skills/.cache
          key: skill-bodies-${{ hashFiles('ecosystem-skills/MANIFEST.json') }}
      # test/case-search-ignore.test.mjs requires real ripgrep in CI.
      - name: ensure ripgrep
        run: command -v rg || { sudo apt-get update && sudo apt-get install -y ripgrep; }
      - run: npm test
      # Assembled Worker + Dynamic Worker boundary tests (offline miniflare wall; fake keys).
      - run: npm run test:smoke
      # Offline eval checks; thresholds live in eval/gates.json (live judge self-test stays manual).
      - run: npm run eval:selftest
      - run: npm run eval:qa:lint -- --stale --enforce-floors
      - run: npm run eval:qa:register -- --check
      - name: lint frozen canonical live contract
        run: |
          BASE="$(node -e 'const event = process.env.GITHUB_EVENT_PATH ? JSON.parse(require("node:fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")) : {}; process.stdout.write(event.pull_request?.base?.sha ?? event.before ?? "HEAD^")')"
          node eval/qa/lint-corpus.mjs --live-contract eval/qa/corpus/live/live-cases.json --since "$(git merge-base HEAD "$BASE")"
      - run: npm run improvements:lint
      # Require a human review ledger entry whenever a skill pin moves.
      - name: skill pin review ledger
        run: |
          BASE="$(node -e 'const e = process.env.GITHUB_EVENT_PATH ? JSON.parse(require("node:fs").readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")) : {}; process.stdout.write(e.pull_request?.base?.sha ?? e.before ?? "HEAD^")')"
          node scripts/check-pin-review.mjs --base "$BASE"
      - run: npm run eval:routing -- --gate
      # Verify generated artifacts match their sources (op-classes depends on build-catalog).
      # site:fonts and site:og fetch unpinned remote fonts and stay outside CI sync.
      - name: generated artifacts in sync
        run: |
          node scripts/build-catalog.mjs
          npm run family-text:build
          npm run spec:build
          npm run site:globes
          node scripts/check-mirrors.mjs
          # check-mirrors only checks INDEX.md exists; rebuild it to catch stale content.
          node ecosystem-skills/build-index.mjs
          node eval/corpus/raven-next/research/golden/_meta/compile.mjs
          node eval/compile-routing.mjs
          node eval/qa/compile-qa.mjs
          node eval/plan/build-op-classes.mjs
          if ! git diff --exit-code --stat -- catalog specs src/mcp/family-text.ts src/policy/corroboration.ts src/demo/globe.ts src/consent-globe.ts ecosystem-skills/INDEX.md eval/corpus/raven-next/research/golden/compiled/golden.json eval/routing-cases.json eval/qa/cases.json eval/qa/sample.json eval/qa/tool-cases.json eval/qa/lifecycle-registry.json eval/plan/op-classes.json; then
            echo "::error::generated artifacts out of sync — run the build scripts locally and commit the result"
            exit 1
          fi
