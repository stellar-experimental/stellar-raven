name: Golden source sentinels

# Re-reads the primary sources named in eval/qa/source-sentinels.json and keeps exactly one open
# issue (label `golden-sentinels`) in step with the drift set. A drift queues the named case for
# golden-truth re-verification before its `truth.reverifyBy` date; it is never evidence by itself.
#
# The report is deterministic (eval/qa/source-sentinels.mjs): its first line carries a fingerprint
# of the drift set only, so read errors cannot churn the issue.
#   drift, no open issue          -> open one
#   drift, fingerprint differs    -> replace the body and add one comment
#   drift, fingerprint same       -> no change
#   no drift, no read errors      -> close an open issue
#   no drift, some read errors    -> leave an open issue as is (an unread page proves nothing)
# Every fetch failing exits 2 before the issue step. No secret is needed; a fork runs it unchanged.

on:
  schedule:
    - cron: "17 7 * * *" # daily 07:17 UTC, after the refresh and dependency-audit workflows
  push:
    branches: [main]
    paths: [eval/qa/source-sentinels.json, eval/qa/source-sentinels.mjs]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: golden-sentinels
  cancel-in-progress: false

env:
  # Same maintainer assignment rule as refresh.yml.
  SENTINEL_ISSUE_ASSIGNEE: ${{ vars.REFRESH_ISSUE_ASSIGNEE || (github.repository == 'stellar-experimental/stellar-raven' && 'kalepail' || github.repository_owner) }}

jobs:
  sentinels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: read the sentinel sources
        id: report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node eval/qa/source-sentinels.mjs --report golden-sentinels-report.md --commit "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: sync the golden-sentinels issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.report.outputs.drift }}
          ERRORS: ${{ steps.report.outputs.errors }}
          FINGERPRINT: ${{ steps.report.outputs.fingerprint }}
        run: |
          if ! gh label list --search golden-sentinels --json name --jq '.[].name' | grep -Fxq golden-sentinels; then
            gh label create golden-sentinels --color FBCA04 --description "Golden primary sources drifted; re-verify the named cases"
          fi
          existing=$(gh issue list --label golden-sentinels --state open --json number --jq '.[0].number // empty')
          if [ "$DRIFT" -gt 0 ]; then
            if [ -z "$existing" ]; then
              created=$(gh issue create --title "Golden source sentinels drifted" --label golden-sentinels --body-file golden-sentinels-report.md)
              gh issue edit "$created" --add-assignee "$SENTINEL_ISSUE_ASSIGNEE" \
                || echo "::warning::Could not assign $SENTINEL_ISSUE_ASSIGNEE to new issue $created"
              echo "Opened $created ($DRIFT drifted)."
            else
              current=$(gh issue view "$existing" --json body --jq '.body' | head -n 1 | sed -n 's/.*golden-sentinels-report fingerprint=\([0-9a-f]\{64\}\).*/\1/p')
              if [ "$current" = "$FINGERPRINT" ]; then
                echo "Drift set unchanged; issue #$existing left as is."
              else
                gh issue edit "$existing" --body-file golden-sentinels-report.md
                gh issue comment "$existing" --body "The drift set changed at commit \`$GITHUB_SHA\`. The issue body shows the current report."
                echo "Updated issue #$existing ($DRIFT drifted)."
              fi
            fi
          elif [ -n "$existing" ] && [ "$ERRORS" -eq 0 ]; then
            gh issue comment "$existing" --body "Every golden source sentinel holds at commit \`$GITHUB_SHA\`. Closing."
            gh issue close "$existing" --reason completed
            echo "Closed issue #$existing."
          elif [ -n "$existing" ]; then
            echo "No drift, but $ERRORS sentinels were unreadable; issue #$existing left open."
          else
            echo "No drift and no open issue ($ERRORS unreadable)."
          fi
