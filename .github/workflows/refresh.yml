name: Refresh (live drift check)

# Re-fetches the live service surfaces (Lumenloop /v1/tools + /v1/me union,
# Stellar Light /api/openapi.json, docs config) and rebuilds the derived
# artifacts. Any diff = upstream drift → an issue is opened/updated and the run
# fails so drift is impossible to miss. Diffing op-id sets is the signal —
# info.version is NOT (Scout has shipped new ops without bumping it).
#
# Also checks the load-bearing Stellar Docs Algolia rule through a read-only,
# analytics:false rules-on/off behavioral delta, and checks the
# ecosystem-skills/ pin set for upstream drift (pinned commit SHAs /
# stellarlight catalog) via check-skills-drift.mjs — detection only; pins are
# never auto-advanced from CI, because skill bodies are prompt input.
#
# Every failure class is an explicit enum captured into the drift issue with its
# own remediation. Three run FIRST, before any builder: pinned-file availability
# (`check-mirrors --fetch`, cache-bypassing — bodies are served not stored, so an
# unresolvable pin is a live user-facing outage), the deployed Worker's own
# retrieval verdict (`/health/skills`), and the QA stale-gospel due-date queue.
# The generic "job crashed" issue is reserved for faults that fit none of them.
#
# The first two answer DIFFERENT questions and both are needed: this workflow
# runs on a GitHub Actions runner, so it can only prove the pins resolve from
# GitHub's network. Whether the deployed Worker can reach them from a Cloudflare
# colo is unobservable here — only the Worker can answer that, which is why an
# hourly cron inside it (src/skills/canary.ts) records a verdict this step reads.
# Green pins + red canary = the content is fine and our access to it is not.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24: build-catalog.mjs relies on native TS type-stripping, stable
          # since Node 23.6 (see scripts/build-catalog.mjs). Do not drop below 24.
          node-version: 24
          cache: npm
      - run: npm ci
      # FIRST, and before any builder: prove every pinned skill file still
      # resolves upstream. `--fetch` bypasses ecosystem-skills/.cache, but this
      # still runs first so the answer is recorded even if a later step dies —
      # and so the class is reported as what it is. A pin that stops resolving
      # is not a flaky script: bodies are not stored, so production skill.read
      # is failing for real users right now.
      - name: check pinned skill files resolve upstream
        id: pins
        run: |
          set -o pipefail
          ec=0
          node scripts/check-mirrors.mjs --fetch 2>&1 | tee pin-availability.txt || ec=$?
          # Three-way, like every other checker here: a runner-side network
          # fault or a crashed script must NOT file an issue asserting that
          # production is down. Only exit 1 means the pin itself is gone.
          case "$ec" in
            0) echo "state=clean" >> "$GITHUB_OUTPUT" ;;
            1) echo "state=unresolvable" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=error" >> "$GITHUB_OUTPUT" ;;
          esac
      # The Worker's own verdict on whether IT can still reach the pinned files.
      # The step above proves the pins resolve from a GitHub Actions runner,
      # which says nothing about Cloudflare egress; only the Worker can answer
      # that, so an hourly cron stores a verdict and this reads it. Staleness is
      # a failure too: a cron that stopped firing is an outage of the detector.
      - name: check production skill retrieval (Worker-side)
        id: canary
        run: |
          set -o pipefail
          # Bounded: without a deadline a stalled connection burns the whole
          # job timeout instead of producing the `error` state, so the
          # check-error path below would never run.
          code=$(curl -sS --connect-timeout 5 --max-time 20 -o canary.json \
            -w '%{http_code}' https://raven.stellar.org/health/skills || echo "000")
          cat canary.json || true
          echo
          # Classifier lives in a tested script, not inline here: YAML-embedded
          # logic cannot be unit tested, and the first inline draft was a
          # SyntaxError that would have failed every run without ever working.
          state=$(node scripts/classify-canary.mjs "$code" canary.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "canary state: $state"
      # Captured, not hard-failed: a past-due reverifyBy is the truth-maintenance
      # queue firing as designed (a documented lane with a documented owner), not
      # an automation fault. Failing here would have routed it to the generic
      # "job crashed" issue with no case ids in it.
      - name: check for stale QA gospel
        id: gospel
        run: |
          set -o pipefail
          ec=0
          node eval/qa/lint-corpus.mjs --stale 2>&1 | tee stale-gospel.txt || ec=$?
          # lint-corpus exits 1 for BOTH a past-due case and its own parse/lint
          # faults, so the exit code alone cannot tell the truth-maintenance
          # queue firing from the linter breaking. The `[stale]` finding it
          # prints is the discriminator; without one, exit 1 is a check error.
          if [ "$ec" = "0" ]; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
          elif [ "$ec" = "1" ] && grep -q '\[stale\]' stale-gospel.txt; then
            echo "state=stale" >> "$GITHUB_OUTPUT"
          else
            echo "state=error" >> "$GITHUB_OUTPUT"
          fi
      # refresh-inventory.mjs reads .env at the repo root; the runner is
      # ephemeral and .env is never uploaded anywhere.
      - name: materialize .env from repo secrets
        run: |
          {
            echo "LUMENLOOP_API_KEY=${{ secrets.LUMENLOOP_API_KEY }}"
            echo "ALGOLIA_APPLICATION_ID_DOCS=${{ secrets.ALGOLIA_APPLICATION_ID_DOCS }}"
            echo "ALGOLIA_APPLICATION_ID_SITE=${{ secrets.ALGOLIA_APPLICATION_ID_SITE }}"
            echo "ALGOLIA_API_KEY_DOCS=${{ secrets.ALGOLIA_API_KEY_DOCS }}"
            echo "ALGOLIA_API_KEY_SITE=${{ secrets.ALGOLIA_API_KEY_SITE }}"
          } > .env
      - run: node scripts/refresh-inventory.mjs
      # Search-only behavioral guard. The script's exit codes distinguish real
      # rule-effect drift (1) from a check/request error (2); both are captured
      # so drift detection can report the right class without exposing keys.
      - name: check load-bearing Algolia rule
        id: algolia_rule
        run: |
          set -o pipefail
          ec=0
          npm run algolia:rule-canary -- --require-env --env-file .env 2>&1 | tee algolia-rule-canary.txt || ec=$?
          case "$ec" in
            0) echo "state=clean" >> "$GITHUB_OUTPUT" ;;
            1) echo "state=drift" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=error" >> "$GITHUB_OUTPUT" ;;
          esac
      - run: node scripts/build-catalog.mjs
      - run: npm run micro-map:build
      - run: npm run spec:build
      # Detection only — never runs ecosystem-skills/update.sh from CI (mirrored
      # skills are prompt input; upstream edits go through human review). Reads
      # LUMENLOOP_API_KEY from the materialized .env like refresh-inventory.mjs.
      # Exit codes are a three-way contract: 0 = clean, 1 = drift, 2 = check
      # error — captured explicitly and mapped to drift=true|false|error so the
      # detect-drift step consumes an enum, never a truthy/empty guess.
      - name: check skills-mirror drift
        id: skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ec=0
          node scripts/check-skills-drift.mjs 2>&1 | tee skills-drift.txt || ec=$?
          case "$ec" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "drift=error" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: detect drift
        id: drift
        run: |
          rm .env
          inventory_drift=false
          git diff --quiet -- inventory catalog specs || inventory_drift=true
          # ENUM check (closes the old fail-open): only the literal strings
          # 'true' and 'false' are valid; anything else — including 'error' and
          # EMPTY (step didn't write the output) — is a check error. The error
          # fails the job in a dedicated step below, but never puts the re-pin
          # remediation into the drift issue; an inventory-only drift issue may
          # still be created.
          skills_drift='${{ steps.skills.outputs.drift }}'
          skills_error=false
          case "$skills_drift" in
            true|false) ;;
            *) skills_error=true ;;
          esac
          algolia_rule_state='${{ steps.algolia_rule.outputs.state }}'
          algolia_rule_error=false
          case "$algolia_rule_state" in
            clean|drift) ;;
            *) algolia_rule_error=true ;;
          esac
          # Same ENUM discipline for the two classes captured before the
          # builders: an empty output means the step never wrote one. That is a
          # check error — never a silent pass, and never coerced into the domain
          # state either, because the domain states assert facts ("production is
          # failing", "a golden is past due") that a broken checker has not
          # established.
          pins_state='${{ steps.pins.outputs.state }}'
          pins_error=false
          case "$pins_state" in clean|unresolvable) ;; *) pins_error=true; pins_state=error ;; esac
          gospel_state='${{ steps.gospel.outputs.state }}'
          gospel_error=false
          case "$gospel_state" in clean|stale) ;; *) gospel_error=true; gospel_state=error ;; esac
          canary_state='${{ steps.canary.outputs.state }}'
          canary_error=false
          case "$canary_state" in clean|failing|stale) ;; *) canary_error=true; canary_state=error ;; esac
          echo "skills_error=$skills_error" >> "$GITHUB_OUTPUT"
          echo "algolia_rule_error=$algolia_rule_error" >> "$GITHUB_OUTPUT"
          echo "pins_error=$pins_error" >> "$GITHUB_OUTPUT"
          echo "gospel_error=$gospel_error" >> "$GITHUB_OUTPUT"
          echo "canary_error=$canary_error" >> "$GITHUB_OUTPUT"
          # DOMAIN states only. A check error must not open a drift issue: it
          # has no section to contribute, so it would file a body that is just a
          # header — and the dedicated fail-on-*-check-error steps below already
          # make the job red without asserting something untrue.
          if [ "$inventory_drift" = "false" ] && [ "$skills_drift" != "true" ] \
             && [ "$algolia_rule_state" != "drift" ] && [ "$pins_state" != "unresolvable" ] \
             && [ "$gospel_state" != "stale" ] && [ "$canary_state" = "clean" ]; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            {
              echo '### Live service drift detected'
              echo
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              if [ "$canary_state" = "stale" ]; then
                echo
                echo '#### Skill-retrieval detector is STALE — current state unknown'
                echo
                echo 'The hourly canary has not recorded a verdict in over 3 hours. This proves the'
                echo 'DETECTOR stopped, and says nothing about whether retrieval works: the last'
                echo 'verdict is simply too old to describe now. Do not read it either way.'
                echo '```'
                cat canary.json 2>/dev/null || echo '(no verdict body)'
                echo '```'
                echo
                echo 'Remediation: check the Worker'"'"'s Cron Trigger and its Past Events in the'
                echo 'Cloudflare dashboard, and `evt: "skill_canary"` in Workers Logs.'
              fi
              if [ "$canary_state" = "failing" ]; then
                echo
                echo '#### :rotating_light: The deployed Worker cannot retrieve skills — LIVE OUTAGE'
                echo
                echo 'This is the Worker'"'"'s own verdict from inside Cloudflare, which is the only'
                echo 'place a colo-egress failure is visible. The pin-availability step above runs on'
                echo 'a GitHub runner and can be green while this is red — that combination means the'
                echo 'content is fine and OUR ACCESS to it is not.'
                echo '```'
                cat canary.json 2>/dev/null || echo '(no verdict body)'
                echo '```'
                echo
                echo 'Remediation: check Worker logs for `evt: "skill_canary"` and `skill_read` with'
                echo 'ok=false, then Cloudflare status and GitHub status. Do not mirror the content to'
                echo '"fix" it — see `ARCHITECTURE.md` §6.'
              fi
              if [ "$pins_state" = "unresolvable" ]; then
                echo
                echo '#### :rotating_light: Pinned skill file did not resolve upstream — LIVE `skill.read` OUTAGE'
                echo
                echo 'Skill bodies are served from their pinned upstream, never stored. A pin that'
                echo 'stops resolving means production `skill.read` is failing for real users right'
                echo 'now on any cold read (warm colo caches and isolate memos may still succeed,'
                echo 'so this can be a PARTIAL outage that looks healthy from one location).'
                echo '```'
                cat pin-availability.txt
                echo '```'
                echo
                echo 'Remediation: confirm the upstream repo/commit still exists and is public. If'
                echo 'the content moved, re-pin (`ecosystem-skills/update.sh`), review the body diff,'
                echo 'and DEPLOY — a merge alone does not reach production. See `ARCHITECTURE.md` §6'
                echo '"availability posture". Do not solve this by mirroring the content.'
              fi
              if [ "$gospel_state" = "stale" ]; then
                echo
                echo '#### QA gospel past its re-verification date'
                echo
                echo 'The standing due-date queue fired. This is the truth-maintenance lane working'
                echo 'as designed, not a script failure.'
                echo '```'
                cat stale-gospel.txt
                echo '```'
                echo
                echo 'Remediation: triage each past-due case through the `golden-truth` lane —'
                echo 're-verify and set a new staggered `reverifyBy`, or record an explicit dated'
                echo 'extension with a rootCause. Never silently bump a date.'
              fi
              if [ "$inventory_drift" = "true" ]; then
                echo
                echo '#### Inventory drift'
                echo
                node scripts/summarize-live-drift.mjs
              fi
              if [ "$skills_drift" = "true" ]; then
                echo
                echo '#### Skills mirror drift'
                echo
                echo '```'
                cat skills-drift.txt
                echo '```'
                echo
                echo 'Remediation: run `ecosystem-skills/update.sh` locally, review the skill diffs (skills are prompt input — read them), re-pin, commit. Never auto-sync from CI.'
              fi
              if [ "$algolia_rule_state" = "drift" ]; then
                echo
                echo '#### Stellar Docs Algolia rule-effect drift'
                echo
                echo 'The read-only rules-on/off canary lost a named ranking invariant:'
                echo '```'
                cat algolia-rule-canary.txt
                echo '```'
                echo
                echo 'Remediation: inspect the live rule and crawler/search behavior read-only; do not auto-write Algolia state.'
              fi
            } > drift-report.md
          fi
      # The credential comes in as a step env var, not from .env: the drift step above
      # deletes .env before this runs. Without it every authenticated probe reports
      # `inconclusive (missing host credential …)`, which is indistinguishable in the log
      # from a probe that ran and could not decide — so the recurrence lane looks alive
      # while silently never probing.
      - name: run improvement recurrence probes
        env:
          LUMENLOOP_API_KEY: ${{ secrets.LUMENLOOP_API_KEY }}
        run: npm run improvements:probes
      - name: open or update drift issue
        if: always() && steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create drift --description "live service surface drifted from committed inventory" --color D93F0B 2>/dev/null || true
          existing=$(gh issue list --label drift --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file drift-report.md
          else
            gh issue create --title "Live service drift detected" --label drift --body-file drift-report.md
          fi
      # Runs after the issue step so an inventory-only drift issue (if any) is
      # still opened/updated before the job fails on the skills-check error.
      - name: fail on skills drift check error
        if: steps.drift.outputs.skills_error == 'true'
        run: |
          echo "::error::skills drift check errored — see skills-drift.txt output"
          exit 1
      - name: fail on Algolia rule check error
        if: steps.drift.outputs.algolia_rule_error == 'true'
        run: |
          echo "::error::Algolia rule canary errored — see algolia-rule-canary.txt output"
          exit 1
      # These two fail the job WITHOUT asserting a domain fact. A crashed
      # check-mirrors or a runner-side network fault is not evidence that
      # production is down, and a broken corpus linter is not evidence that a
      # golden is past due — so neither writes a section into the drift issue.
      - name: fail on pin-availability check error
        if: steps.drift.outputs.pins_error == 'true'
        run: |
          echo "::error::pinned-file availability check errored (not a proven pin loss) — see pin-availability.txt"
          exit 1
      - name: fail on production-canary check error
        if: steps.drift.outputs.canary_error == 'true'
        run: |
          echo "::error::could not read the Worker canary verdict (not a proven outage) — see canary.json"
          exit 1
      - name: fail on stale-gospel check error
        if: steps.drift.outputs.gospel_error == 'true'
        run: |
          echo "::error::QA gospel lint errored with no [stale] finding (not a proven past-due case) — see stale-gospel.txt"
          exit 1
      - name: fail on drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "::error::live services drifted from the committed inventory and/or skills mirror — see the drift issue"
          exit 1
      # Crash guard for GENUINELY UNCLASSIFIED failures only. Every drift class
      # with a documented owner — unresolvable pin, stale gospel, inventory,
      # skills-HEAD, Algolia rule — is captured as an enum above and reported in
      # the drift issue with its own remediation, so it never lands here. What
      # remains is a real script fault (refresh-inventory / build-catalog /
      # micro-map / spec:build) that died before drift detection completed, which
      # would otherwise be just a red scheduled run. Gated on the drift step NOT
      # having succeeded, so the intentional exit-1 steps above don't trip this.
      # Static body only — never echoes .env / secret values.
      - name: open or update refresh-failure issue
        if: failure() && steps.drift.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Refresh job crashed'
            echo
            echo 'The daily refresh failed BEFORE drift detection completed — an UNCLASSIFIED'
            echo 'script error (refresh-inventory / build-catalog / micro-map / spec:build).'
            echo
            echo 'Every known drift class is captured as an enum and reported in the drift issue'
            echo 'with its own remediation — an unresolvable skill pin, stale QA gospel, inventory'
            echo 'drift, skills-HEAD drift, and Algolia rule drift all land there, not here. If one'
            echo 'of those is the real cause, this workflow has a routing bug as well.'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > refresh-failure.md
          gh label create refresh-failure --description "daily refresh job crashed before drift detection" --color B60205 2>/dev/null || true
          existing=$(gh issue list --label refresh-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file refresh-failure.md
          else
            gh issue create --title "Refresh job crashed" --label refresh-failure --body-file refresh-failure.md
          fi
