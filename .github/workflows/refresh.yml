name: Refresh (live drift check)

# Re-fetches the live service surfaces (Lumenloop /v1/tools + /v1/me union,
# Stellar Light /api/openapi.json, Stellar Docs Mintlify backend and llms.txt
# page index and rendered section anchors) and rebuilds the derived
# artifacts. Any diff = upstream drift -> per-kind keyed drift issues are
# opened/updated/closed by scripts/sync-drift-issues.mjs and the run fails so
# drift is impossible to miss. Diffing op-id sets is the signal —
# info.version is NOT (Scout has shipped new ops without bumping it).
#
# Also checks the
# ecosystem-skills/ pin set for upstream drift (pinned commit SHAs /
# stellarlight catalog / community directory) via check-skills-drift.mjs —
# detection only; pins are never auto-advanced from CI, because skill bodies are
# prompt input.
#
# Every failure class is an explicit enum mapped to a stable `<class>:<source>`
# drift key with its own issue and remediation. Three run FIRST, before any
# builder: pinned-file availability (`check-mirrors --fetch`, cache-bypassing —
# bodies are served not stored, so an unresolvable pin is a live user-facing
# outage), the deployed Worker's own retrieval verdict (`/health/skills`), and
# the QA stale-gospel due-date queue. The generic "job crashed" issue is
# reserved for faults that fit none of them.
#
# The first two answer DIFFERENT questions and both are needed: this workflow
# runs on a GitHub Actions runner, so it can only prove the pins resolve from
# GitHub's network. Whether the deployed Worker can reach them from a Cloudflare
# colo is unobservable here — only the Worker can answer that, which is why an
# hourly cron inside it (src/skills/canary.ts) records a verdict this step reads.
# Green pins + red canary = the content is fine and our access to it is not.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  # Assignment subscribes the maintainer to later plain comments without requiring repo watch.
  # Do not replace it with a bot @mention: delivery is undocumented and would direct-ping daily.
  REFRESH_ISSUE_ASSIGNEE: ${{ vars.REFRESH_ISSUE_ASSIGNEE || (github.repository == 'stellar-experimental/stellar-raven' && 'kalepail' || github.repository_owner) }}
  RAVEN_SERVICE_URL: ${{ vars.RAVEN_SERVICE_URL || 'https://raven.stellar.org' }}

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check live refresh configuration
        id: check
        env:
          LUMENLOOP_API_KEY: ${{ secrets.LUMENLOOP_API_KEY }}
          MINTLIFY_ASSISTANT_API_KEY: ${{ secrets.MINTLIFY_ASSISTANT_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          CONFIGURED_SERVICE_URL: ${{ vars.RAVEN_SERVICE_URL }}
        run: |
          configured=true
          for name in LUMENLOOP_API_KEY MINTLIFY_ASSISTANT_API_KEY; do
            if [ -z "${!name}" ]; then
              if [ "$REPOSITORY" = "stellar-experimental/stellar-raven" ]; then
                echo "::error::$name is absent. The live refresh requires this secret."
                exit 1
              fi
              configured=false
              echo "::notice::$name is absent. The live refresh will skip."
            fi
          done
          if [ "$REPOSITORY" != "stellar-experimental/stellar-raven" ] && [ -z "$CONFIGURED_SERVICE_URL" ]; then
            configured=false
            echo "::notice::Set RAVEN_SERVICE_URL to your fork's service URL. The live refresh will skip."
          fi
          printf 'configured=%s\n' "$configured" >> "$GITHUB_OUTPUT"
  refresh:
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24: build-catalog.mjs relies on native TS type-stripping, stable
          # since Node 23.6 (see scripts/build-catalog.mjs). Do not drop below 24.
          node-version: 24
          cache: npm
      - run: npm ci
      # FIRST, and before any builder: prove every pinned skill file still
      # resolves upstream. `--fetch` bypasses ecosystem-skills/.cache, but this
      # still runs first so the answer is recorded even if a later step dies —
      # and so the class is reported as what it is. A pin that stops resolving
      # is not a flaky script: bodies are not stored, so production skill.read
      # is failing for real users right now.
      - name: check pinned skill files resolve upstream
        id: pins
        run: |
          set -o pipefail
          ec=0
          node scripts/check-mirrors.mjs --fetch 2>&1 | tee pin-availability.txt || ec=$?
          # Three-way, like every other checker here: a runner-side network
          # fault or a crashed script must NOT file an issue asserting that
          # production is down. Only exit 1 means the pin itself is gone.
          case "$ec" in
            0) echo "state=clean" >> "$GITHUB_OUTPUT" ;;
            1) echo "state=unresolvable" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=error" >> "$GITHUB_OUTPUT" ;;
          esac
      # The Worker's own verdict on whether IT can still reach the pinned files.
      # The step above proves the pins resolve from a GitHub Actions runner,
      # which says nothing about Cloudflare egress; only the Worker can answer
      # that, so an hourly cron stores a verdict and this reads it. Staleness is
      # a failure too: a cron that stopped firing is an outage of the detector.
      - name: check production skill retrieval (Worker-side)
        id: canary
        run: |
          set -o pipefail
          # Bounded: without a deadline a stalled connection burns the whole
          # job timeout instead of producing the `error` state, so the
          # check-error path below would never run.
          code=$(curl -sS --connect-timeout 5 --max-time 20 -o canary.json \
            -w '%{http_code}' "${RAVEN_SERVICE_URL%/}/health/skills" || echo "000")
          cat canary.json || true
          echo
          # Classifier lives in a tested script, not inline here: YAML-embedded
          # logic cannot be unit tested, and the first inline draft was a
          # SyntaxError that would have failed every run without ever working.
          state=$(node scripts/classify-canary.mjs "$code" canary.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "canary state: $state"
      # Captured, not hard-failed: a past-due reverifyBy is the truth-maintenance
      # queue firing as designed (a documented lane with a documented owner), not
      # an automation fault. Failing here would have routed it to the generic
      # "job crashed" issue with no case ids in it.
      - name: check for stale QA gospel
        id: gospel
        run: |
          set -o pipefail
          ec=0
          node eval/qa/lint-corpus.mjs --stale 2>&1 | tee stale-gospel.txt || ec=$?
          # lint-corpus exits 1 for BOTH a past-due case and its own parse/lint
          # faults, so the exit code alone cannot tell the truth-maintenance
          # queue firing from the linter breaking. The `[stale]` finding it
          # prints is the discriminator; without one, exit 1 is a check error.
          if [ "$ec" = "0" ]; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
          elif [ "$ec" = "1" ] && grep -q '\[stale\]' stale-gospel.txt; then
            echo "state=stale" >> "$GITHUB_OUTPUT"
          else
            echo "state=error" >> "$GITHUB_OUTPUT"
          fi
      - name: refresh docs section anchors without credentials
        id: anchors
        continue-on-error: true
        run: |
          set -o pipefail
          ec=0
          npm run docs:anchors:build 2>&1 | tee docs-anchors.txt || ec=$?
          case "$ec" in
            0) echo "state=ok" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=error" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$ec"
      # refresh-inventory.mjs reads .env at the repo root; the runner is
      # ephemeral and .env is never uploaded anywhere.
      - name: materialize .env from repo secrets
        run: |
          {
            echo "LUMENLOOP_API_KEY=${{ secrets.LUMENLOOP_API_KEY }}"
            echo "MINTLIFY_ASSISTANT_API_KEY=${{ secrets.MINTLIFY_ASSISTANT_API_KEY }}"
          } > .env
      - run: node scripts/refresh-inventory.mjs
      # build-catalog / family-text / spec:build fetch pinned skill bodies on a cold
      # runner. When check-mirrors already proved a pin unresolvable, skip them so
      # the confirmed pin outage reaches detect drift and opens pins:ecosystem-skills
      # instead of crashing into the generic refresh-failure issue.
      - name: rebuild derived catalog and specs
        id: builders
        if: steps.pins.outputs.state != 'unresolvable'
        run: |
          node scripts/build-catalog.mjs
          npm run family-text:build
          npm run spec:build
      # Detection only — never runs ecosystem-skills/update.sh from CI (mirrored
      # skills are prompt input; upstream edits go through human review). Reads
      # LUMENLOOP_API_KEY from the materialized .env like refresh-inventory.mjs.
      # Exit codes are a three-way contract: 0 = clean, 1 = drift, 2 = check
      # error — captured explicitly and mapped to drift=true|false|error so the
      # detect-drift step consumes an enum, never a truthy/empty guess.
      - name: check skills-mirror drift
        id: skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ec=0
          node scripts/check-skills-drift.mjs --json > skills-drift.json || ec=$?
          cat skills-drift.json || true
          case "$ec" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "drift=error" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: detect drift
        id: drift
        env:
          PINS_STATE: ${{ steps.pins.outputs.state }}
          CANARY_STATE: ${{ steps.canary.outputs.state }}
          GOSPEL_STATE: ${{ steps.gospel.outputs.state }}
          ANCHORS_STATE: ${{ steps.anchors.outputs.state }}
          SKILLS_DRIFT: ${{ steps.skills.outputs.drift }}
          DERIVED_CHECKED: ${{ steps.builders.outcome == 'success' && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -f .env
          node scripts/sync-drift-issues.mjs collect \
            --out drift-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --run-url "$RUN_URL" \
            --pins-state "$PINS_STATE" --pins-file pin-availability.txt \
            --canary-state "$CANARY_STATE" --canary-file canary.json \
            --gospel-state "$GOSPEL_STATE" --gospel-file stale-gospel.txt \
            --anchors-state "$ANCHORS_STATE" \
            --skills-drift "$SKILLS_DRIFT" --skills-file skills-drift.json \
            --derived-checked "$DERIVED_CHECKED"
      # The credential comes in as a step env var, not from .env: the drift step above
      # deletes .env before this runs. Without it every authenticated probe reports
      # `inconclusive (missing host credential …)`, which is indistinguishable in the log
      # from a probe that ran and could not decide — so the recurrence lane looks alive
      # while silently never probing.
      - name: run improvement recurrence probes
        env:
          LUMENLOOP_API_KEY: ${{ secrets.LUMENLOOP_API_KEY }}
        run: npm run improvements:probes
      # Issues track the default branch only; a manual dispatch from another
      # branch runs in --dry-run mode so it cannot close or mutate main's issues.
      - name: sync drift issues
        if: (success() || failure()) && steps.drift.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          extra=()
          if [ "$IS_DEFAULT_BRANCH" != "true" ]; then
            echo "::notice::Non-default ref (${GITHUB_REF}); running drift issue sync in --dry-run mode."
            extra+=(--dry-run)
          fi
          node scripts/sync-drift-issues.mjs sync \
            --report drift-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --assignee "$REFRESH_ISSUE_ASSIGNEE" \
            "${extra[@]}"
      # Runs after the issue sync step so any detected drift issues are still
      # reconciled before the job fails on a checker error.
      - name: fail on skills drift check error
        if: steps.drift.outputs.skills_error == 'true'
        run: |
          echo "::error::skills drift check errored — see skills-drift.json output"
          exit 1
      # These two fail the job WITHOUT asserting a domain fact. A crashed
      # check-mirrors or a runner-side network fault is not evidence that
      # production is down, and a broken corpus linter is not evidence that a
      # golden is past due — so neither opens or closes a drift issue.
      - name: fail on pin-availability check error
        if: steps.drift.outputs.pins_error == 'true'
        run: |
          echo "::error::pinned-file availability check errored (not a proven pin loss) — see pin-availability.txt"
          exit 1
      - name: fail on production-canary check error
        if: steps.drift.outputs.canary_error == 'true'
        run: |
          echo "::error::could not read the Worker canary verdict (not a proven outage) — see canary.json"
          exit 1
      - name: fail on stale-gospel check error
        if: steps.drift.outputs.gospel_error == 'true'
        run: |
          echo "::error::QA gospel lint errored with no [stale] finding (not a proven past-due case) — see stale-gospel.txt"
          exit 1
      - name: fail on drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "::error::live refresh detected drift or an anchor capture error — see the open drift issue(s)"
          exit 1
      # Crash guard for GENUINELY UNCLASSIFIED failures only. Every drift class
      # with a documented owner — unresolvable pin, stale gospel, inventory,
      # skills-HEAD, anchor capture error — is captured as an enum above and reported in
      # its own keyed drift issue with its own remediation, so it never lands here. What
      # remains is a real script fault (refresh-inventory / build-catalog /
      # family-text / spec:build) that died before drift detection completed, which
      # would otherwise be just a red scheduled run. Gated on the drift step NOT
      # having succeeded, so the intentional exit-1 steps above don't trip this.
      # Static body only — never echoes .env / secret values.
      - name: open or update refresh-failure issue
        if: failure() && steps.drift.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Refresh job crashed'
            echo
            echo 'The daily refresh failed BEFORE drift detection completed — an UNCLASSIFIED'
            echo 'script error (refresh-inventory / build-catalog / family-text / spec:build).'
            echo
            echo 'Every known drift class is captured as an enum and reported in its own drift issue'
            echo 'with its own remediation — an unresolvable skill pin, stale QA gospel, inventory'
            echo 'drift, skills-HEAD drift, and anchor capture errors all land there, not here. If one is the'
            echo 'real cause, this workflow has a routing bug as well.'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > refresh-failure.md
          gh label create refresh-failure --description "daily refresh job crashed before drift detection" --color B60205 2>/dev/null || true
          existing=$(gh issue list --label refresh-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            if ! gh issue view "$existing" --json assignees --jq '.assignees[].login' | grep -Fxq "$REFRESH_ISSUE_ASSIGNEE"; then
              gh issue edit "$existing" --add-assignee "$REFRESH_ISSUE_ASSIGNEE" \
                || echo "::warning::Could not assign $REFRESH_ISSUE_ASSIGNEE to refresh-failure issue #$existing"
            fi
            gh issue comment "$existing" --body-file refresh-failure.md
          else
            created=$(gh issue create --title "Refresh job crashed" --label refresh-failure --body-file refresh-failure.md)
            gh issue edit "$created" --add-assignee "$REFRESH_ISSUE_ASSIGNEE" \
              || echo "::warning::Could not assign $REFRESH_ISSUE_ASSIGNEE to new refresh-failure issue $created"
          fi
