name: Refresh (live drift check)

# Re-fetches live service surfaces (Lumenloop, Stellar Light, Stellar Docs) and rebuilds derived
# artifacts. scripts/sync-drift-issues.mjs reconciles one keyed `<class>:<source>` issue per drift
# kind and fails on drift. Diffing op-id sets is the signal (Scout may add ops without bumping info.version).
#
# Skills drift (check-skills-drift.mjs) is detection-only; pins require human review.
# Three checks run before builders: upstream pin resolution (`check-mirrors --fetch`, GitHub runner
# egress), deployed Worker `/health/skills` canary (Cloudflare egress, src/skills/canary.ts), and
# stale QA gospel due dates. Unclassified crashes before detect-drift open `refresh-failure`.

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  # Assign rather than @mention to subscribe the maintainer without daily direct pings.
  REFRESH_ISSUE_ASSIGNEE: ${{ vars.REFRESH_ISSUE_ASSIGNEE || (github.repository == 'stellar-experimental/stellar-raven' && 'kalepail' || github.repository_owner) }}
  RAVEN_SERVICE_URL: ${{ vars.RAVEN_SERVICE_URL || 'https://raven.stellar.org' }}

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check live refresh configuration
        id: check
        env:
          LUMENLOOP_API_KEY: ${{ secrets.LUMENLOOP_API_KEY }}
          MINTLIFY_ASSISTANT_API_KEY: ${{ secrets.MINTLIFY_ASSISTANT_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          CONFIGURED_SERVICE_URL: ${{ vars.RAVEN_SERVICE_URL }}
        run: |
          configured=true
          for name in LUMENLOOP_API_KEY MINTLIFY_ASSISTANT_API_KEY; do
            if [ -z "${!name}" ]; then
              if [ "$REPOSITORY" = "stellar-experimental/stellar-raven" ]; then
                echo "::error::$name is absent. The live refresh requires this secret."
                exit 1
              fi
              configured=false
              echo "::notice::$name is absent. The live refresh will skip."
            fi
          done
          if [ "$REPOSITORY" != "stellar-experimental/stellar-raven" ] && [ -z "$CONFIGURED_SERVICE_URL" ]; then
            configured=false
            echo "::notice::Set RAVEN_SERVICE_URL to your fork's service URL. The live refresh will skip."
          fi
          printf 'configured=%s\n' "$configured" >> "$GITHUB_OUTPUT"
  refresh:
    needs: configuration
    if: needs.configuration.outputs.configured == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 24 required for native TS type-stripping (scripts/build-catalog.mjs).
          node-version: 24
          cache: npm
      - run: npm ci
      # Run before builders so an unresolvable pin (live skill.read outage) is classified accurately.
      - name: check pinned skill files resolve upstream
        id: pins
        run: |
          set -o pipefail
          ec=0
          node scripts/check-mirrors.mjs --fetch 2>&1 | tee pin-availability.txt || ec=$?
          # Only exit 1 proves a missing pin; other non-zero exits map to error, not an outage issue.
          case "$ec" in
            0) echo "state=clean" >> "$GITHUB_OUTPUT" ;;
            1) echo "state=unresolvable" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=error" >> "$GITHUB_OUTPUT" ;;
          esac
      # Worker-side egress check (runner check above does not prove Cloudflare reachability); stale verdict also fails.
      - name: check production skill retrieval (Worker-side)
        id: canary
        run: |
          set -o pipefail
          # Bounded timeouts so a stall yields state=error instead of burning the job timeout.
          code=$(curl -sS --connect-timeout 5 --max-time 20 -o canary.json \
            -w '%{http_code}' "${RAVEN_SERVICE_URL%/}/health/skills" || echo "000")
          cat canary.json || true
          echo
          # Keep classifier in a tested script rather than inline YAML.
          state=$(node scripts/classify-canary.mjs "$code" canary.json)
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "canary state: $state"
      # Capture instead of failing hard so past-due reverifyBy routes to its keyed drift issue.
      - name: check for stale QA gospel
        id: gospel
        run: |
          set -o pipefail
          ec=0
          node eval/qa/lint-corpus.mjs --stale 2>&1 | tee stale-gospel.txt || ec=$?
          # Exit 1 covers both stale cases and lint faults; [stale] distinguishes the two.
          if [ "$ec" = "0" ]; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
          elif [ "$ec" = "1" ] && grep -q '\[stale\]' stale-gospel.txt; then
            echo "state=stale" >> "$GITHUB_OUTPUT"
          else
            echo "state=error" >> "$GITHUB_OUTPUT"
          fi
      - name: refresh docs section anchors without credentials
        id: anchors
        continue-on-error: true
        run: |
          set -o pipefail
          ec=0
          npm run docs:anchors:build 2>&1 | tee docs-anchors.txt || ec=$?
          case "$ec" in
            0) echo "state=ok" >> "$GITHUB_OUTPUT" ;;
            *) echo "state=error" >> "$GITHUB_OUTPUT" ;;
          esac
          exit "$ec"
      # refresh-inventory.mjs reads .env; removed before later steps and never uploaded.
      - name: materialize .env from repo secrets
        run: |
          {
            echo "LUMENLOOP_API_KEY=${{ secrets.LUMENLOOP_API_KEY }}"
            echo "MINTLIFY_ASSISTANT_API_KEY=${{ secrets.MINTLIFY_ASSISTANT_API_KEY }}"
          } > .env
      - run: node scripts/refresh-inventory.mjs
      # Skip builders when a pin is already proven unresolvable so detect-drift still opens pins:ecosystem-skills.
      - name: rebuild derived catalog and specs
        id: builders
        if: steps.pins.outputs.state != 'unresolvable'
        run: |
          node scripts/build-catalog.mjs
          npm run family-text:build
          npm run spec:build
      # Detection only (pins require human review); reads LUMENLOOP_API_KEY from .env.
      # Exit codes: 0=clean, 1=drift, 2=error.
      - name: check skills-mirror drift
        id: skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          ec=0
          node scripts/check-skills-drift.mjs --json > skills-drift.json || ec=$?
          cat skills-drift.json || true
          case "$ec" in
            0) echo "drift=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "drift=error" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: detect drift
        id: drift
        env:
          PINS_STATE: ${{ steps.pins.outputs.state }}
          CANARY_STATE: ${{ steps.canary.outputs.state }}
          GOSPEL_STATE: ${{ steps.gospel.outputs.state }}
          ANCHORS_STATE: ${{ steps.anchors.outputs.state }}
          SKILLS_DRIFT: ${{ steps.skills.outputs.drift }}
          DERIVED_CHECKED: ${{ steps.builders.outcome == 'success' && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          rm -f .env
          node scripts/sync-drift-issues.mjs collect \
            --out drift-report.json \
            --github-output "$GITHUB_OUTPUT" \
            --run-url "$RUN_URL" \
            --pins-state "$PINS_STATE" --pins-file pin-availability.txt \
            --canary-state "$CANARY_STATE" --canary-file canary.json \
            --gospel-state "$GOSPEL_STATE" --gospel-file stale-gospel.txt \
            --anchors-state "$ANCHORS_STATE" \
            --skills-drift "$SKILLS_DRIFT" --skills-file skills-drift.json \
            --derived-checked "$DERIVED_CHECKED"
      # Pass credential via env because detect-drift removed .env; without it authenticated probes report inconclusive.
      - name: run improvement recurrence probes
        env:
          LUMENLOOP_API_KEY: ${{ secrets.LUMENLOOP_API_KEY }}
        run: npm run improvements:probes
      # Non-default branches run --dry-run so manual dispatches cannot mutate main's issues.
      - name: sync drift issues
        if: (success() || failure()) && steps.drift.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          extra=()
          if [ "$IS_DEFAULT_BRANCH" != "true" ]; then
            echo "::notice::Non-default ref (${GITHUB_REF}); running drift issue sync in --dry-run mode."
            extra+=(--dry-run)
          fi
          node scripts/sync-drift-issues.mjs sync \
            --report drift-report.json \
            --repo "$GITHUB_REPOSITORY" \
            --assignee "$REFRESH_ISSUE_ASSIGNEE" \
            "${extra[@]}"
      # Fail on checker errors after issue sync so detected drift is still reconciled.
      - name: fail on skills drift check error
        if: steps.drift.outputs.skills_error == 'true'
        run: |
          echo "::error::skills drift check errored — see skills-drift.json output"
          exit 1
      # Checker errors fail the job without asserting a domain outage or stale case.
      - name: fail on pin-availability check error
        if: steps.drift.outputs.pins_error == 'true'
        run: |
          echo "::error::pinned-file availability check errored (not a proven pin loss) — see pin-availability.txt"
          exit 1
      - name: fail on production-canary check error
        if: steps.drift.outputs.canary_error == 'true'
        run: |
          echo "::error::could not read the Worker canary verdict (not a proven outage) — see canary.json"
          exit 1
      - name: fail on stale-gospel check error
        if: steps.drift.outputs.gospel_error == 'true'
        run: |
          echo "::error::QA gospel lint errored with no [stale] finding (not a proven past-due case) — see stale-gospel.txt"
          exit 1
      - name: fail on drift
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "::error::live refresh detected drift or an anchor capture error — see the open drift issue(s)"
          exit 1
      # Fallback for unclassified crashes before detect-drift succeeds (known drift classes open keyed issues above).
      # Static body only — never echoes .env or secrets.
      - name: open or update refresh-failure issue
        if: failure() && steps.drift.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Refresh job crashed'
            echo
            echo 'The daily refresh failed BEFORE drift detection completed — an UNCLASSIFIED'
            echo 'script error (refresh-inventory / build-catalog / family-text / spec:build).'
            echo
            echo 'Every known drift class is captured as an enum and reported in its own drift issue'
            echo 'with its own remediation — an unresolvable skill pin, stale QA gospel, inventory'
            echo 'drift, skills-HEAD drift, and anchor capture errors all land there, not here. If one is the'
            echo 'real cause, this workflow has a routing bug as well.'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > refresh-failure.md
          gh label create refresh-failure --description "daily refresh job crashed before drift detection" --color B60205 2>/dev/null || true
          existing=$(gh issue list --label refresh-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            if ! gh issue view "$existing" --json assignees --jq '.assignees[].login' | grep -Fxq "$REFRESH_ISSUE_ASSIGNEE"; then
              gh issue edit "$existing" --add-assignee "$REFRESH_ISSUE_ASSIGNEE" \
                || echo "::warning::Could not assign $REFRESH_ISSUE_ASSIGNEE to refresh-failure issue #$existing"
            fi
            gh issue comment "$existing" --body-file refresh-failure.md
          else
            created=$(gh issue create --title "Refresh job crashed" --label refresh-failure --body-file refresh-failure.md)
            gh issue edit "$created" --add-assignee "$REFRESH_ISSUE_ASSIGNEE" \
              || echo "::warning::Could not assign $REFRESH_ISSUE_ASSIGNEE to new refresh-failure issue $created"
          fi
